*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-radial-gradient(circle at 85% -10%,transparent 0 26px,var(--contour) 26px 27.5px),

main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sea);font-weight:600}

.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}

/* intro */

.hero h1 span{color:var(--accent)}

input.t{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);color:var(--ink)}

.err{color:var(--bad);font-weight:600;margin:8px 0 0;min-height:1.4em}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 10px}
.score{font-family:var(--mono);font-weight:600;font-size:14px}

.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.hint{margin-top:12px;font-size:15px;color:var(--muted);border-top:1.5px dashed var(--line);padding-top:10px}
.linkbtn{background:none;border:0;color:var(--sea);text-decoration:underline;padding:8px 0;font-weight:600;min-height:44px}

.rv .s-ok{color:var(--ok);font-weight:600} .rv .s-rev{color:var(--bad);font-weight:600}

.rr.l0{border-color:var(--bad)} .rr.l1{border-color:#C98A12} .rr.l2{border-color:var(--sea)} .rr.l3{border-color:var(--ok)}
.rr .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}

.rr .cd{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rr .lv{font-family:var(--mono);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.rr p{margin:4px 0 0;font-size:15px}
.rr .res{font-family:var(--mono);font-size:13px;color:var(--muted)}
.glob{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:2px solid var(--sea);border-radius:10px;padding:12px 14px;font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .panel{animation:rise .35s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
@media (max-width:420px){ body{font-size:16px} .card{padding:16px 14px} .var input{width:84px} }

<body>
<main id="app" aria-live="polite"></main>
<script>
/*GEN-START*/
let R=Math.random;
function hash(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^h>>>16)>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=(a,b)=>Math.floor(R()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const nz=(a,b)=>{let v;do v=rnd(a,b);while(v===0);return v;};
const num=c=>String(c).replace('-','−');
function lin(terms){
  let s='';
  terms.forEach(([c,v])=>{
    if(c===0)return;
    const ab=Math.abs(c);
    const body=v?(ab===1?v:ab+v):String(ab);
    if(!s)s=(c<0?'−':'')+body; else s+=(c<0?' − ':' + ')+body;
  });
  return s||'0';
}
const eqQ=(a,b,c)=>lin([[a,'x²'],[b,'x'],[c,'']])+' = 0';
const eqT=(a,b,c)=>lin([[a,'t²'],[b,'t'],[c,'']])+' = 0';
const srt=(a,b)=>a<b?[a,b]:[b,a];

/* A1: ax² + c = 0 */
function genA1(){
  const r=rnd(2,9),a=rnd(1,5);
  const forma=pick([0,1]);
  const line=forma?`${a===1?'':a}x² = ${a*r*r}`:`${lin([[a,'x²'],[-a*r*r,'']])} = 0`;
  const opts=shuffle([
    {t:'Despejo x² y hago la raíz cuadrada, con los dos signos (±)',ok:true},
    {t:'Saco factor común x y la igualo a 0',ok:false},
    {t:'Despejo x² y hago la raíz cuadrada, pero solo con el signo +',ok:false},
    {t:'Divido los dos miembros entre x',ok:false}]);
  const [x1,x2]=[-r,r];
  return {kind:0,label:'Parte A · Ecuación incompleta (sin término en x)',statement:{lines:[line]},
   stages:[
    {type:'mc',crit:'m',short:'método',prompt:'¿Cómo se resuelve esta ecuación?',options:opts.map(o=>o.t),correct:opts.findIndex(o=>o.ok),
     hint:'No hay término en x: solo x² y un número. Despeja x².',
     explain:`x² = ${r*r} → x = ±${r}`},
    {type:'sol',crit:'s',short:'soluciones',unordered:true,prompt:'Escribe las dos soluciones (en cualquier orden).',
     vars:[{name:'x1',answer:x1},{name:'x2',answer:x2}],
     hint:'Después de despejar x², la raíz cuadrada tiene dos soluciones: una positiva y otra negativa.',
     explain:`x² = ${r*r} → x = ${num(x1)} y x = ${r}.`}]};
}
/* A2: ax² + bx = 0 */
function genA2(){
  const a=rnd(1,5),s=nz(-9,9);if(Math.abs(s)<2)return genA2();
  const b=a*s;
  const line=`${lin([[a,'x²'],[b,'x']])} = 0`;
  const good=`x(${lin([[a,'x'],[b,'']])}) = 0`;
  const bads=[`x(${lin([[a,'x'],[-b,'']])}) = 0`,`x(${lin([[a,'x²'],[b,'']])}) = 0`,`(${lin([[1,'x'],[a,'']])})(${lin([[1,'x'],[b,'']])}) = 0`];
  const opts=shuffle([{t:good,ok:true},...bads.map(t=>({t,ok:false}))]);
  const [x1,x2]=srt(0,-s);
  return {kind:0,label:'Parte A · Ecuación incompleta (sin término libre)',statement:{lines:[line]},
   stages:[
    {type:'mc',crit:'m',short:'factor común',prompt:'¿Qué factorización por factor común es correcta?',options:opts.map(o=>o.t),correct:opts.findIndex(o=>o.ok),
     hint:'Los dos términos tienen x. Saca x fuera del paréntesis y comprueba multiplicando.',
     explain:good},
    {type:'sol',crit:'s',short:'soluciones',unordered:true,prompt:'Escribe las dos soluciones (en cualquier orden).',
     vars:[{name:'x1',answer:x1},{name:'x2',answer:x2}],
     hint:'Un producto es 0 si uno de los factores es 0: iguala a 0 cada factor.',
     explain:`x = 0 o ${lin([[a,'x'],[b,'']])} = 0 → x = ${num(-s)}.`}]};
}
/* A3: completa, discriminante */
function genA3(){
  for(;;){
    const r1=nz(-6,6),r2=nz(-6,6),a=pick([1,1,2,3]);
    if(r1===r2||r1+r2===0)continue;
    const b=-a*(r1+r2),c=a*r1*r2,D=b*b-4*a*c;
    const cand=[b*b+4*a*c,-D,b*b-2*a*c,2*b-4*a*c,b*b-4*a+c,D+2*a];
    const bads=[];cand.forEach(v=>{if(v!==D&&!bads.includes(v))bads.push(v);});
    if(bads.length<3)continue;
    const opts=shuffle([{t:'Δ = '+num(D),ok:true},...bads.slice(0,3).map(v=>({t:'Δ = '+num(v),ok:false}))]);
    const [x1,x2]=srt(r1,r2);
    return {kind:0,label:'Parte A · Ecuación completa (fórmula)',statement:{lines:[eqQ(a,b,c)]},
     stages:[
      {type:'mc',crit:'m',short:'discriminante',prompt:`En ${eqQ(a,b,c)} tienes a = ${a}, b = ${num(b)} y c = ${num(c)}. ¿Cuánto vale Δ = b² − 4ac?`,options:opts.map(o=>o.t),correct:opts.findIndex(o=>o.ok),
       hint:'Cuidado con los signos: b² siempre es positivo y −4ac cambia el signo del producto a·c.',
       explain:`Δ = (${num(b)})² − 4·${a}·(${num(c)}) = ${num(D)}`},
      {type:'sol',crit:'s',short:'soluciones',unordered:true,prompt:'Resuelve con la fórmula. Escribe las dos soluciones (en cualquier orden).',
       vars:[{name:'x1',answer:x1},{name:'x2',answer:x2}],
       hint:'x = (−b ± √Δ) / (2a). Calcula con el + y con el −, y divide todo el numerador entre 2a.',
       explain:`x = (${num(-b)} ± ${Math.sqrt(D)}) / ${2*a} → x = ${num(x1)} y x = ${num(x2)}.`}]};
  }
}
/* A4: reorganizar y resolver */
function genA4(){
  for(;;){
    const r1=nz(-6,6),r2=nz(-6,6);
    if(r1===r2||r1+r2===0)continue;
    const m=-(r1+r2),c=r1*r2;
    let line,vari;
    if(c<0&&R()<.5){line=`x(${lin([[1,'x'],[m,'']])}) = ${-c}`;}
    else{
      const p=nz(-4,4),q=m-p;if(q===0)continue;
      const N=p*q-c;if(N===0)continue;
      line=`(${lin([[1,'x'],[p,'']])})(${lin([[1,'x'],[q,'']])}) = ${num(N)}`;
    }
    const forms=[[m,c],[m,-c],[-m,c],[-m,-c]];
    const opts=shuffle(forms.map(([bb,cc],i)=>({t:eqQ(1,bb,cc),ok:i===0})));
    const [x1,x2]=srt(r1,r2);
    return {kind:0,label:'Parte A · Reorganizar y resolver',statement:{lines:[line]},
     stages:[
      {type:'mc',crit:'p',short:'forma general',prompt:'¿Cuál es la forma general ax² + bx + c = 0 de esta ecuación?',options:opts.map(o=>o.t),correct:opts.findIndex(o=>o.ok),
       hint:'Primero desarrolla el producto. Después pasa todo a un lado para que el otro quede en 0 (cambia de signo lo que pasas).',
       explain:eqQ(1,m,c)},
      {type:'sol',crit:'s',short:'soluciones',unordered:true,prompt:'Resuelve la ecuación. Escribe las dos soluciones (en cualquier orden).',
       vars:[{name:'x1',answer:x1},{name:'x2',answer:x2}],
       hint:'Con la forma general puedes usar la fórmula. Comprueba sustituyendo en la ecuación del enunciado.',
       explain:`${eqQ(1,m,c)} → x = ${num(x1)} y x = ${num(x2)}.`}]};
  }
}
/* B1: finca */
function genB1(){
  const r=rnd(5,15),d=rnd(2,9),A=r*(r+d);
  const ctx=pick([['una finca de plataneras','de la finca'],['una parcela de viñedo','de la parcela'],['un terreno de papas','del terreno']]);
  const good=eqQ(1,d,-A);
  const bads=[eqQ(1,d,A),eqQ(1,-d,-A),`${lin([[2,'x'],[d,'']])} = ${A}`];
  const opts=shuffle([{t:good,ok:true},...bads.map(t=>({t,ok:false}))]);
  return {kind:1,label:'Parte B · Problema de la finca',statement:{story:`En La Orotava, ${ctx[0]} es rectangular y tiene ${A} m². El largo mide ${d} m más que el ancho. Sea x el ancho (en metros).`},
   stages:[
    {type:'mc',crit:'p',short:'planteamiento',prompt:'¿Qué ecuación plantea correctamente el problema?',options:opts.map(o=>o.t),correct:opts.findIndex(o=>o.ok),
     hint:`El largo es x + ${d}. El área es ancho · largo = ${A}. Desarrolla y pasa todo a un lado.`,
     explain:`x(x + ${d}) = ${A} → ${good}`},
    {type:'sol',crit:'s',short:'solución',prompt:`Resuelve y escribe las medidas ${ctx[1]} (en metros). Recuerda descartar lo que no tenga sentido.`,
     vars:[{name:'ancho',answer:r,note:'metros'},{name:'largo',answer:r+d,note:'metros'}],
     hint:'La ecuación tiene dos soluciones; una longitud no puede ser negativa.',
     explain:`x = ${r} o x = ${-(r+d)} (se descarta). Ancho ${r} m y largo ${r+d} m (${r}·${r+d} = ${A}).`}]};
}
/* B2: cohete */
function genB2(){
  for(;;){
    const t1=rnd(3,5),t2=-rnd(1,2);
    const v=5*(t1+t2),h0=-5*t1*t2;
    const h=lin([[h0,''],[v,'t'],[-5,'t²']]).replace(/^/,'');
    const hf=`${h0} + ${v}t − 5t²`;
    const maxH=h0+v*v/20;
    const X=pick([h0+5,h0+10,Math.ceil(maxH)+3]);
    const D=v*v+20*(h0-X);
    const sol=D>0?0:D===0?1:2;
    const good=eqT(-5,v,h0);
    const bads=[eqT(-5,v,0),eqT(-5,v,-h0),eqT(5,v,h0)];
    const o1=shuffle([{t:good,ok:true},...bads.map(t=>({t,ok:false}))]);

    const exH=`${h0} + ${v}t − 5t² = ${X} → ${eqT(-5,v,h0-X)} → Δ = ${v}² + 20·(${h0-X}) = ${num(D)}`+(D>0?': dos soluciones.':D===0?': una solución.':': no hay solución.');

function check(){
  const q=curQ(),st=curSt(),lg=q.logs[S.si];
  let ok,text,extra={};
  if(st.type==='mc'){
    if(S.sel===null)return;
    ok=S.sel===st.correct;
    text=String.fromCharCode(65+S.sel)+') '+st.options[S.sel].replace(/\n/g,'   /   ');
    extra.idx=S.sel;
  }else{
    const raw=st.vars.map((v,i)=>document.getElementById('v'+i).value);
    const vals=raw.map(r=>r.trim().replace('−','-').replace(',','.'));
    if(vals.some(v=>!/^-?\d+(\.\d+)?$/.test(v))){S.fb={k:'info',t:'Escribe un número en cada casilla.',m:'Puedes usar el botón ± para el signo. Este intento no cuenta.'};renderKeep();return;}
    {const nv=vals.map(Number),an=st.vars.map(v=>v.answer);ok=st.unordered?nv.slice().sort((a,b)=>a-b).every((x,i)=>x===an.slice().sort((a,b)=>a-b)[i]):an.every((x,i)=>nv[i]===x);}
    text=st.vars.map((v,i)=>v.name+' = '+num(vals[i])).join(' ;  ');
  }
  lg.attempts.push({text,ok,...extra});
  const n=lg.attempts.length;
  if(ok){
    lg.status=n===1?'ok1':'ok';
    S.fb={k:'good',t:n===1?'¡Correcto a la primera!':'¡Correcto!',m:'',ex:st.explain};

  }
  S.sel=null;save();
  renderPlay();
  if(lg.status){const nx=document.getElementById('nxt');nx&&nx.focus();}
}

const LV=['Insuficiente','Suficiente','Notable','Sobresaliente'];
const lvl=r=>r>=.85?3:r>=.65?2:r>=.4?1:0;
const val=l=>l.status==='ok1'?1:l.status==='ok'?(l.attempts.length===2?.6:.3):0;
function wr(crit){let a=0,n=0;S.qs.forEach(q=>q.logs.forEach((l,j)=>{if(crit.includes(q.stages[j].crit)){a+=val(l);n++;}}));return n?a/n:0;}
const RUB=[
 {code:'MAT 1.1',name:'Plantear y reorganizar la ecuación',crit:['p'],d:[
  'No consigue plantear o reorganizar la ecuación; necesita ver la respuesta.',
  'Plantea o reorganiza la ecuación solo en los casos más sencillos y tras varios intentos.',
  'Plantea y reorganiza correctamente la ecuación en la mayoría de los casos; corrige algún error.',
  'Plantea y reorganiza siempre correctamente la ecuación, casi siempre a la primera.']},
 {code:'MAT 1.2',name:'Elegir y aplicar el método',crit:['m'],d:[
  'No identifica el método adecuado (despeje, factor común, discriminante); necesita ver la respuesta.',
  'Identifica el método adecuado solo en los casos sencillos y tras varios intentos.',

  'Elige siempre el método más adecuado y calcula el discriminante sin errores, casi siempre a la primera.']},
 {code:'MAT 1.3',name:'Obtener y comprobar las soluciones',crit:['s'],d:[
  'No obtiene las soluciones; necesita ver las respuestas.',
  'Obtiene alguna solución, con errores frecuentes de signos o de cálculo, y no siempre descarta la que no vale.',
  'Obtiene las soluciones con algún error de signos o cálculo que corrige y descarta las que no valen en el contexto.',
  'Obtiene todas las soluciones con precisión y decide cuáles valen en el contexto, casi siempre a la primera.']},
 {code:'MAT 2.1',name:'Hipótesis y discriminante',crit:['h'],d:[
  'No relaciona el discriminante con el número de soluciones.',
  'Calcula el discriminante pero necesita varios intentos para interpretarlo.',
  'Interpreta el discriminante y decide si la hipótesis se cumple, con algún error corregido.',
  'Interpreta el discriminante y contrasta la hipótesis a la primera.']},
 {code:'MAT 9.2',name:'Revisar los errores',d:[
  'Tras equivocarse no corrige: en casi todos los errores se le muestra la solución.',
  'Reconoce y corrige solo algunos de sus errores al reintentar.',
  'Reconoce y corrige la mayoría de sus errores revisando el procedimiento.',
  'Reconoce y corrige todos o casi todos sus errores, o no comete errores relevantes.']}
];
function rubric(){
  const out=[];const pct=r=>Math.round(100*r)+' % de acierto';
  RUB.slice(0,4).forEach(x=>{const r=wr(x.crit);out.push({...x,lv:lvl(r),res:pct(r)});});
  let e=0,c=0;
  S.qs.forEach(q=>q.logs.forEach(l=>{if(l.attempts.some(a=>!a.ok)){e++;if(l.status!=='revealed')c++;}}));
  out.push({...RUB[4],lv:e?lvl(c/e):3,res:e?c+' de '+e+' errores corregidos':'Sin errores'});
  const m=out.reduce((a,x)=>a+x.lv,0)/out.length;
  return {rows:out,global:LV[Math.round(m)]};
}

        x+=cw[i];
      }
      y+=h;
    });
    y+=4;
    add('Nivel global de logro: '+Rb.global,{bold:true,size:10.5,after:1});
    add('Observaciones del docente: ________________________________________________________________',{size:9,color:col.mut,after:1});
    add('______________________________________________________________________________________________',{size:9,color:col.mut});
  })();
  y+=3;
  S.qs.forEach((q,i)=>{
    if(y>235){doc.addPage();y=18;}
    doc.setDrawColor(...col.acc);doc.setLineWidth(0.5);doc.line(M,y,M+CW,y);y+=5;
    add('Prueba '+(i+1)+' - '+q.label,{bold:true,size:11.5,color:col.acc,after:1});
    if(q.statement.lines)q.statement.lines.forEach((l,k)=>add('('+(k+1)+')  '+l,{mono:true,size:11,indent:3}));
    else add(q.statement.story,{size:10,indent:3});
    y+=1.5;
    q.stages.forEach((st,j)=>{
      const lg=q.logs[j];
      if(y>250){doc.addPage();y=18;}
      add('Paso '+(j+1)+': '+st.prompt,{bold:true,size:10,after:0.5});
      lg.attempts.forEach((a,k)=>add('Intento '+(k+1)+':  '+a.text+'   ->   '+(a.ok?'CORRECTO':'INCORRECTO'),{size:9.5,indent:4,color:a.ok?col.ok:col.bad}));
      if(!lg.attempts.length)add('Sin respuesta.',{size:9.5,indent:4,color:col.bad});
      if(lg.status==='revealed'){
        add('Respuesta correcta: '+correctText(st).replace(/\n/g,' / '),{size:9.5,indent:4,color:col.mut});
        add('Resolucion: '+st.explain.replace(/\n/g,' '),{size:9,indent:4,color:col.mut});
      }
      add('Pista usada: '+(lg.hint?'si':'no'),{size:9,indent:4,color:col.mut,after:2});
    });
    y+=2;
  });
  const n=doc.getNumberOfPages();
  for(let p=1;p<=n;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,130,128);
    doc.text(lat('Operacion Teide (Mision Mirador) - '+S.name+' - pagina '+p+' de '+n),M,291);}
  return doc;
}
async function download(){
  const e=document.getElementById('e');e.style.color='';e.textContent='';
  let doc;
  try{doc=buildPDF();}catch(err){e.textContent='No se pudo crear el PDF: '+err.message;return;}
  const blob=doc.output('blob');
  const slug=lat(S.name).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40)||'alumno';
  const filename='Mision_Mirador_'+slug+'.pdf';
  let dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(_){dl=null;}
  try{
    if(dl){await dl.save({filename,data:blob});e.style.color='var(--ok)';e.textContent='PDF guardado. Ya puedes subirlo a Classroom.';}
    else{
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
      e.style.color='var(--ok)';e.textContent='Descarga iniciada. Si no aparece el archivo, avisa a tu profesor/a.';
    }
  }catch(err){
    const c=err&&err.code;
    e.style.color='var(--bad)';
    e.textContent=c==='declined'?'Cancelaste la descarga. Pulsa de nuevo cuando quieras guardar el PDF.':'No se pudo guardar el PDF ('+(c||err.message||'error')+'). Inténtalo de nuevo.';
  }
}

try{const l=JSON.parse(localStorage.getItem(SK+'last'));if(l){S.name=l.name||'';S.group=l.group||'';}}catch(e){}
render();

</script>
